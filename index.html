<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WeatherVS</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <meta name="apple-mobile-web-app-title" content="WeatherVS">

    <!-- PWA/Browser Icon -->
    <!-- Pointing to PUBLIC EXTERNAL URL to bypass local Auth/Login screens -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .weather-card { transition: transform 0.3s ease, box-shadow 0.3s ease; perspective: 1400px; }
        .weather-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .weather-card:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }

        /* --- Flip Card --- */
        .card-inner {
            display: grid;
            grid-template-columns: 100%;
            grid-template-rows: 100%;
            height: 100%;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-face {
            grid-area: 1 / 1;
            position: relative;
            min-width: 0;
            border-radius: 1rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
        }
        .card-face > .face-body { flex: 1 1 auto; min-height: 0; }
        .card-back {
            transform: rotateY(180deg) translateZ(0);
            -webkit-transform: rotateY(180deg) translateZ(0);
        }

        /* --- Trend (back face) layout ---
           Absolutely positioned slots: the card face is a definite-height grid item, so
           top/bottom offsets give the chart host the card's REAL leftover height on both
           the short desktop card and the tall single-column mobile card. No percentage
           height chain involved. */
        .trend-header { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10; }
        .trend-footer { position: absolute; bottom: 10px; left: 12px; right: 12px; z-index: 10; }
        .chart-host {
            position: absolute;
            top: 54px;
            bottom: 32px;
            left: 12px;
            right: 12px;
            z-index: 10;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chart-host svg { display: block; width: 100%; height: 100%; }

        @media (min-width: 768px) {
            .trend-header { top: 18px; left: 20px; right: 20px; }
            .trend-footer { bottom: 14px; left: 20px; right: 20px; }
            .chart-host { top: 66px; bottom: 42px; left: 20px; right: 20px; }
        }

        body { overscroll-behavior-y: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-blue-100">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10 pt-safe-top">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="cloud-sun" class="text-blue-500 w-8 h-8"></i>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight hidden sm:block">WeatherVS</h1>
            </div>

            <div class="flex items-center gap-4">
                <button id="unitToggleBtn" class="flex items-center gap-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-bold text-slate-600 transition-colors" title="Toggle Units">
                    <i data-lucide="scale" class="w-4 h-4 text-slate-500"></i>
                    <span id="unitLabel">Metric</span>
                </button>

                <button id="apiKeyBtn" class="text-sm text-slate-500 hover:text-blue-600 flex items-center gap-1 transition-colors">
                    <span id="keyIconWrapper"><i data-lucide="key" class="w-4 h-4"></i></span>
                    <span id="apiKeyStatus" class="hidden sm:inline">Set API Key</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-2 md:px-4 py-4 md:py-8 max-w-4xl pb-safe-bottom">

        <!-- API Key Modal -->
        <div id="apiModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md transform transition-all">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="lock" class="w-5 h-5 text-blue-500"></i>
                    Configure API Key
                </h2>
                <p class="text-sm text-slate-600 mb-4">
                    This tool uses the OpenWeatherMap API. Your key is stored locally in your browser.
                </p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">API Key</label>
                        <input type="password" id="apiKeyInput" placeholder="Paste your OpenWeatherMap key here"
                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div class="flex gap-3 justify-end">
                        <button id="cancelKeyBtn" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm font-medium transition-colors">Cancel</button>
                        <button id="saveKeyBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium shadow-md transition-all active:scale-95">Save Key</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Controls -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 md:p-6 mb-4 md:mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                <div class="relative">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">City 1</label>
                    <div class="relative">
                        <i data-lucide="map-pin" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                        <input type="text" id="city1" placeholder="e.g. London" value="Asheville"
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>

                <div class="relative">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">City 2</label>
                    <div class="relative">
                        <i data-lucide="map-pin" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                        <input type="text" id="city2" placeholder="e.g. Tokyo" value="Mount Pearl"
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>
            </div>

            <div class="mt-6 flex justify-center">
                <button id="compareBtn" class="group flex items-center gap-2 px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-full font-semibold shadow-lg shadow-blue-200 transition-all hover:scale-105 active:scale-95 w-full md:w-auto justify-center">
                    <span>Compare Weather</span>
                    <i data-lucide="arrow-right-left" class="w-4 h-4 transition-transform group-hover:rotate-180"></i>
                </button>
            </div>

            <p id="errorMsg" class="hidden mt-4 text-center text-red-500 text-sm bg-red-50 py-2 px-4 rounded-lg border border-red-100"></p>
        </div>

        <!-- Install PWA Button -->
        <div id="installContainer" class="hidden mb-6 flex justify-center">
             <button id="installBtn" class="text-xs bg-slate-800 text-white px-4 py-2 rounded-full flex items-center gap-2 hover:bg-slate-900 transition shadow-lg">
                <i data-lucide="download" class="w-3 h-3"></i>
                Install App
            </button>
        </div>

        <!-- Results Display -->
        <div id="resultsArea" class="hidden grid grid-cols-2 gap-2 md:gap-6 relative items-stretch">
            <div class="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-white rounded-full shadow-lg items-center justify-center z-10 border-4 border-slate-50 text-slate-400 font-black text-sm">VS</div>
            <div id="card1" class="weather-card rounded-2xl drop-shadow-lg cursor-pointer select-none"></div>
            <div id="card2" class="weather-card rounded-2xl drop-shadow-lg cursor-pointer select-none"></div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden py-12 flex flex-col items-center justify-center text-slate-400">
            <div class="w-10 h-10 border-4 border-blue-100 border-t-blue-500 rounded-full animate-spin mb-4"></div>
            <p class="text-sm font-medium">Fetching weather data...</p>
        </div>
    </main>

    <footer class="py-6 text-center text-slate-400 text-xs md:text-sm">
        <p>Powered by OpenWeatherMap API</p>
    </footer>

    <script>
        // --- PWA Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered!', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // --- PWA Install Prompt Logic ---
        let deferredPrompt;
        const installContainer = document.getElementById('installContainer');
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installContainer.classList.remove('hidden');
        });

        if(installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`User response to the install prompt: ${outcome}`);
                    deferredPrompt = null;
                    installContainer.classList.add('hidden');
                }
            });
        }

        // --- Existing App Logic ---
        const apiKeyBtn = document.getElementById('apiKeyBtn');
        const keyIconWrapper = document.getElementById('keyIconWrapper');
        const unitToggleBtn = document.getElementById('unitToggleBtn');
        const unitLabel = document.getElementById('unitLabel');
        const apiModal = document.getElementById('apiModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const cancelKeyBtn = document.getElementById('cancelKeyBtn');
        const apiKeyStatus = document.getElementById('apiKeyStatus');
        const compareBtn = document.getElementById('compareBtn');
        const city1Input = document.getElementById('city1');
        const city2Input = document.getElementById('city2');
        const resultsArea = document.getElementById('resultsArea');
        const loadingState = document.getElementById('loadingState');
        const errorMsg = document.getElementById('errorMsg');
        const card1 = document.getElementById('card1');
        const card2 = document.getElementById('card2');

        let apiKey = localStorage.getItem('weather_api_key') || '';
        let unitSystem = localStorage.getItem('weather_units') || 'metric';
        let currentData1 = null;
        let currentData2 = null;

        updateKeyStatus();
        updateUnitUI();

        apiKeyBtn.addEventListener('click', () => { apiKeyInput.value = apiKey; apiModal.classList.remove('hidden'); });
        cancelKeyBtn.addEventListener('click', () => { apiModal.classList.add('hidden'); });
        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) { apiKey = key; localStorage.setItem('weather_api_key', apiKey); updateKeyStatus(); apiModal.classList.add('hidden'); if(city1Input.value && city2Input.value) compareWeather(); }
        });
        unitToggleBtn.addEventListener('click', () => {
            unitSystem = unitSystem === 'metric' ? 'imperial' : 'metric';
            localStorage.setItem('weather_units', unitSystem);
            updateUnitUI();
            if (currentData1 && currentData2) { renderCard(card1, currentData1); renderCard(card2, currentData2); lucide.createIcons(); }
        });
        compareBtn.addEventListener('click', compareWeather);
        [city1Input, city2Input].forEach(input => { input.addEventListener('keypress', (e) => { if (e.key === 'Enter') compareWeather(); }); });

        // --- Card Flip (event delegation so it survives innerHTML re-renders) ---
        resultsArea.addEventListener('click', (e) => {
            if (e.target.closest('.trend-toggle')) return; // handled separately
            const card = e.target.closest('.weather-card');
            if (card) toggleCard(card);
        });
        resultsArea.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const card = e.target.closest('.weather-card');
            if (!card) return;
            e.preventDefault();
            toggleCard(card);
        });

        // Trend mode toggle (delegated, on the back face)
        resultsArea.addEventListener('click', (e) => {
            const btn = e.target.closest('.trend-toggle');
            if (!btn) return;
            e.stopPropagation();
            const card = btn.closest('.weather-card');
            if (!card) return;
            toggleChartMode(card);
        });

        function toggleCard(card) {
            const inner = card.querySelector('.card-inner');
            if (!inner) return;
            const flipped = inner.classList.toggle('flipped');
            card.dataset.flipped = flipped ? 'true' : 'false';
            card.setAttribute('aria-label', flipped
                ? `${card.dataset.cityName || 'City'} temperature trend. Activate to flip back.`
                : `${card.dataset.cityName || 'City'} current weather. Activate for the temperature trend.`);
            // The chart is measured/drawn while the back face is hidden, so force a redraw
            refreshChart(card);
        }

        function toggleChartMode(card) {
            const state = chartState.get(card);
            if (!state) return;
            state.mode = state.mode === '3day' ? 'hourly' : '3day';
            state.lastW = 0; state.lastH = 0; // force redraw
            // Update subtitle label
            const subtitle = card.querySelector('.trend-subtitle');
            if (subtitle) subtitle.textContent = state.mode === '3day' ? `Next 3 days · ${tempUnitSuffix()}` : `Next 6 hrs · 3-hourly · ${tempUnitSuffix()}`;
            // Update toggle button label
            const btnLabel = card.querySelector('.trend-toggle-label');
            if (btnLabel) btnLabel.textContent = state.mode === '3day' ? '6 hrs' : '3 day';
            state.draw();
            state.schedule();
        }

        function updateKeyStatus() {
            if (apiKey) { apiKeyStatus.textContent = 'API Key Saved'; apiKeyBtn.classList.replace('text-slate-500', 'text-green-600'); keyIconWrapper.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i>'; }
            else { apiKeyStatus.textContent = 'Set API Key'; apiKeyBtn.classList.replace('text-green-600', 'text-slate-500'); keyIconWrapper.innerHTML = '<i data-lucide="key" class="w-4 h-4"></i>'; }
            lucide.createIcons();
        }

        function updateUnitUI() { unitLabel.textContent = unitSystem === 'metric' ? '°C / km/h' : '°F / mph'; }

        async function compareWeather() {
            if (!apiKey) { showError('Please set your OpenWeatherMap API Key first.'); apiKeyBtn.click(); return; }
            const c1 = city1Input.value.trim(); const c2 = city2Input.value.trim();
            if (!c1 || !c2) { showError('Please enter two city names.'); return; }
            hideError(); resultsArea.classList.add('hidden'); loadingState.classList.remove('hidden');
            try {
                const [data1, data2] = await Promise.all([fetchWeather(c1), fetchWeather(c2)]);
                currentData1 = data1; currentData2 = data2;
                renderCard(card1, data1); renderCard(card2, data2);
                loadingState.classList.add('hidden'); resultsArea.classList.remove('hidden'); lucide.createIcons();
                refreshChart(card1); refreshChart(card2);
            } catch (err) { loadingState.classList.add('hidden'); showError(err.message); }
        }

        // Every request gets a hard deadline. A hung request must not strand the spinner:
        // AbortController fires, the fetch rejects, and the caller renders an error state.
        const REQUEST_TIMEOUT_MS = 10000;

        async function fetchWithTimeout(url, timeoutMs = REQUEST_TIMEOUT_MS) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { signal: controller.signal });
            } catch (err) {
                if (err.name === 'AbortError') throw new Error(`Request timed out after ${Math.round(timeoutMs / 1000)}s`);
                throw err;
            } finally {
                clearTimeout(timer);
            }
        }

        async function fetchWeather(city) {
            const query = `q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;
            const currentUrl = `https://api.openweathermap.org/data/2.5/weather?${query}`;
            const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?${query}&cnt=24`;
            let currentRes, forecastRes;
            try {
                // The forecast is optional: if it fails or times out we degrade to a
                // current-conditions card rather than failing the whole comparison.
                const forecastPromise = fetchWithTimeout(forecastUrl).catch(err => ({ ok: false, error: err }));
                [currentRes, forecastRes] = await Promise.all([fetchWithTimeout(currentUrl), forecastPromise]);
            } catch (err) {
                throw new Error(`Could not reach OpenWeatherMap for ${city}. ${err.message}`);
            }
            if (!currentRes.ok) {
                if (currentRes.status === 401) throw new Error('Invalid API Key.');
                if (currentRes.status === 404) throw new Error(`City "${city}" not found.`);
                throw new Error(`Error fetching data for ${city}`);
            }
            const current = await currentRes.json();
            let hourly = [];
            let forecastList = [];
            if (forecastRes.ok) {
                try {
                    const forecastJson = await forecastRes.json();
                    forecastList = forecastJson.list || [];
                    hourly = buildHourlyTemps(current, forecastJson);
                } catch (e) { hourly = []; }
            }
            if (!hourly.length) hourly = [{ dt: Math.floor(Date.now() / 1000), tempC: current.main.temp, label: 'Now' }];
            const daily = buildDailyTemps(current, forecastList);
            return { current, hourly, daily };
        }

        // 3-hourly forecast -> hourly x-positions across the next 6 hours.
        // The temp LINE is linearly interpolated between 3-hourly samples, which is a
        // defensible smoothing of a single measurement. The high/low BAND comes from the
        // forecast buckets' own min/max. Each point records whether it sits on a real bucket,
        // so the chart can refuse to print H:/L: numbers for positions it invented.
        function buildHourlyTemps(current, forecast) {
            const now = Math.floor(Date.now() / 1000);

            const midSamples = [{ dt: now, v: current.main.temp }];
            const bandByDt = new Map();

            (forecast.list || []).forEach(item => {
                if (!item?.main || typeof item.main.temp !== 'number') return;
                midSamples.push({ dt: item.dt, v: item.main.temp });
                bandByDt.set(item.dt, {
                    hi: item.main.temp_max ?? item.main.temp,
                    lo: item.main.temp_min ?? item.main.temp
                });
            });

            const sort = arr => arr.sort((a, b) => a.dt - b.dt);
            sort(midSamples);
            const maxSamples = sort([...bandByDt.entries()].map(([dt, v]) => ({ dt, v: v.hi })));
            const minSamples = sort([...bandByDt.entries()].map(([dt, v]) => ({ dt, v: v.lo })));

            // Returns null (not 0) when there is nothing to interpolate: a missing forecast
            // must not silently become 0°C.
            const interp = (samples, t) => {
                if (!samples.length) return null;
                if (t <= samples[0].dt) return samples[0].v;
                for (let i = 1; i < samples.length; i++) {
                    const prev = samples[i - 1], next = samples[i];
                    if (t <= next.dt) {
                        const gap = (next.dt - prev.dt) || 1;
                        return prev.v + (t - prev.dt) / gap * (next.v - prev.v);
                    }
                }
                return samples[samples.length - 1].v;
            };

            const points = [{
                dt: now,
                tempC: current.main.temp,
                // At the observation instant only temp is a real measurement. Collapse the band
                // instead of dressing up the observation's unreliable temp_min/temp_max as spread.
                highC: current.main.temp,
                lowC: current.main.temp,
                label: 'Now',
                interpolated: false
            }];

            for (let h = 1; h <= 6; h++) {
                const target = now + (h * 3600);
                const tempC = interp(midSamples, target) ?? current.main.temp;
                const sample = bandByDt.get(target);
                points.push({
                    dt: target,
                    tempC,
                    highC: sample ? sample.hi : (interp(maxSamples, target) ?? tempC),
                    lowC:  sample ? sample.lo : (interp(minSamples, target) ?? tempC),
                    label: formatHourLabel(target, current.timezone),
                    // True only where a real 3-hourly bucket lands on this hour.
                    interpolated: !sample
                });
            }
            return points;
        }

        function formatHourLabel(dt, timezoneOffset) {
            const local = new Date((dt + (timezoneOffset || 0)) * 1000);
            let hour = local.getUTCHours();
            const meridiem = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12 || 12;
            return `${hour} ${meridiem}`;
        }

        // 3-hourly forecast list -> 4 points: Today + next 3 days
        // Each point carries daily high, low, and prevailing weather condition.
        function buildDailyTemps(current, forecastList) {
            const tz = current.timezone || 0;
            const buckets = {};

            forecastList.forEach(item => {
                if (!item || !item.main || typeof item.main.temp !== 'number') return;
                const localDate = new Date((item.dt + tz) * 1000);
                const key = `${localDate.getUTCFullYear()}-${localDate.getUTCMonth()}-${localDate.getUTCDate()}`;
                if (!buckets[key]) buckets[key] = { highs: [], lows: [], dt: item.dt, condTally: {} };
                // Use temp_min / temp_max if available, otherwise temp itself
                buckets[key].highs.push(item.main.temp_max ?? item.main.temp);
                buckets[key].lows.push(item.main.temp_min  ?? item.main.temp);
                if (item.weather?.[0]) {
                    const id = item.weather[0].id;
                    buckets[key].condTally[id] = (buckets[key].condTally[id] || 0) + 1;
                }
            });

            // Seed today's bucket with the current observation's CONDITION only.
            // main.temp_min / main.temp_max from the 2.5 /weather endpoint describe the spread
            // around the current observation, NOT the day's high and low -- OWM warns they are
            // unreliable for cities. They must never enter the high/low sets: the daily envelope
            // comes from the forecast buckets alone, so there is exactly one source of truth.
            const nowDt = Math.floor(Date.now() / 1000);
            const todayLocal = new Date((nowDt + tz) * 1000);
            const todayKey = `${todayLocal.getUTCFullYear()}-${todayLocal.getUTCMonth()}-${todayLocal.getUTCDate()}`;
            if (!buckets[todayKey]) buckets[todayKey] = { highs: [], lows: [], dt: nowDt, condTally: {} };
            if (current.weather?.[0]) {
                const id = current.weather[0].id;
                buckets[todayKey].condTally[id] = (buckets[todayKey].condTally[id] || 0) + 1;
            }

            // Only buckets that actually hold forecast temperature samples can produce a
            // high/low. Without this filter, a condition-only "today" bucket would yield
            // Math.max() of an empty array (-Infinity).
            const days = Object.keys(buckets)
                .filter(key => buckets[key].highs.length > 0)
                .sort()
                .slice(0, 4);

            // No forecast => no daily high/low. Degrade honestly by returning nothing, rather
            // than dressing the observation's temp_min/temp_max up as a daily envelope.
            if (!days.length) return [];

            return days.map((key, idx) => {
                const b = buckets[key];
                const highC = Math.max(...b.highs);
                const lowC  = Math.min(...b.lows);
                const tempC = (highC + lowC) / 2;
                const label = idx === 0 ? 'Today' : new Date((b.dt + tz) * 1000).toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' });
                const tally = b.condTally;
                const condId = Object.keys(tally).length
                    ? Number(Object.keys(tally).reduce((a, c) => tally[a] > tally[c] ? a : c))
                    : null;
                return { dt: b.dt, tempC, highC, lowC, label, condId };
            });
        }

        function displayTemp(tempC) { return unitSystem === 'metric' ? tempC : (tempC * 9 / 5) + 32; }
        function tempUnitSuffix() { return unitSystem === 'metric' ? '°C' : '°F'; }

        // Map OWM condition ID ranges to a representative emoji
        function condIdToEmoji(id) {
            if (id == null) return '';
            if (id >= 200 && id < 300) return '⛈\uFE0F';  // Thunderstorm
            if (id >= 300 && id < 400) return '🌦\uFE0F';  // Drizzle
            if (id >= 500 && id < 511) return '🌧\uFE0F';  // Rain
            if (id === 511)            return '🌨\uFE0F';  // Freezing rain
            if (id >= 512 && id < 600) return '🌧\uFE0F';  // Shower rain
            if (id >= 600 && id < 700) return '❄\uFE0F';   // Snow
            if (id >= 700 && id < 800) return '🌫\uFE0F';  // Atmosphere (fog/haze/dust)
            if (id === 800)            return '☀\uFE0F';   // Clear
            if (id === 801)            return '🌤\uFE0F';  // Few clouds
            if (id === 802)            return '⛅';         // Scattered clouds
            if (id >= 803)             return '☁\uFE0F';   // Broken/overcast clouds
            return '';
        }

        // --- Inline SVG line chart (no external chart library) ---
        // Dual high/low lines with a shaded band between them.
        function buildTempChartSVG(points, gradientId, width, height) {
            if (points.length < 2) {
                return `<span class="text-white/80 text-xs font-medium">Trend data unavailable</span>`;
            }

            const hasCondIcons = points.some(p => p.condId != null);
            const highVals = points.map(p => displayTemp(p.highC));
            const lowVals  = points.map(p => displayTemp(p.lowC));

            const W = Math.max(120, Math.round(width));
            const H = Math.max(120, Math.round(height));
            const tight = W < 280;
            const valFont = tight ? 9 : 10;
            const xFont   = tight ? 8 : 10;
            const iconFont = tight ? 11 : 13;
            const iconSize = iconFont + 3;

            const pad = { top: tight ? 28 : 36, right: tight ? 16 : 26, bottom: tight ? 22 : 28, left: tight ? 16 : 26 };
            if (hasCondIcons) pad.bottom += iconSize;

            const estWidth = (text, font) => text.length * font * 0.6;

            const innerW = W - pad.left - pad.right;
            const stepX  = innerW / (points.length - 1);

            // Fit plan for x-axis labels
            function fitPlan(maxLabelW, step, gap) {
                if (maxLabelW + gap <= step) return { every: 1, bands: 1 };
                if (maxLabelW + gap <= step * 2) return { every: 1, bands: 2 };
                if (maxLabelW + gap <= step * 4) return { every: 2, bands: 2 };
                return { every: 3, bands: 2 };
            }
            const xPlan = fitPlan(Math.max(...points.map(p => estWidth(p.label, xFont))), stepX, 4);
            if (xPlan.bands > 1) pad.bottom += xFont + 5;

            const availH = H - pad.top - pad.bottom;
            const plotH  = Math.max(60, Math.min(availH, Math.max(W * 1.6, 170)));
            const topY   = pad.top + Math.max(0, (availH - plotH) / 2);
            const baseY  = topY + plotH;

            // Scale from a unified range covering both highs and lows
            let minV = Math.min(...lowVals);
            let maxV = Math.max(...highVals);
            if (maxV - minV < 5) { const mid = (maxV + minV) / 2; minV = mid - 2.5; maxV = mid + 2.5; }
            const span = (maxV - minV) || 1;
            const toY  = v => topY + (1 - (v - minV) / span) * plotH;

            const hPts = highVals.map((v, i) => ({ x: pad.left + i * stepX, y: toY(v) }));
            const lPts = lowVals.map( (v, i) => ({ x: pad.left + i * stepX, y: toY(v) }));

            const pathD = pts => `M ${pts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ')}`;

            // Band fill: high line forward + low line backward
            const bandPath = `${pathD(hPts)} L ${[...lPts].reverse().map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L ')} Z`;

            // Grid lines
            const grid = [0, 0.25, 0.5, 0.75, 1].map(r => {
                const y = (topY + r * plotH).toFixed(1);
                return `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="3 4"/>`;
            }).join('');

            const filterId = `${gradientId}-ts`;
            const haloStyle = 'paint-order:stroke;stroke-linejoin:round;';
            const clampX = (x, tw) => Math.min(Math.max(x, tw / 2 + 2), W - tw / 2 - 2);
            const makeLabel = (text, x, y) => {
                const tw = estWidth(text, valFont);
                return `<text x="${clampX(x, tw).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="${valFont}" font-weight="700" fill="#ffffff" style="${haloStyle}stroke:rgba(10,15,30,0.92);stroke-width:4px;" filter="url(#${filterId})">${text}</text>`;
            };

            // Dots + H/L value labels
            let dotsHtml = '';
            points.forEach((pt, i) => {
                const hx = hPts[i].x, hy = hPts[i].y;
                const lx = lPts[i].x, ly = lPts[i].y;
                const rH = tight ? 2.5 : 3, rL = tight ? 2.5 : 3;

                // High dot (amber)
                dotsHtml += `<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="${rH}" fill="#fcd34d" stroke="rgba(10,15,30,0.5)" stroke-width="1.5"/>`;
                // Low dot (sky)
                dotsHtml += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="${rL}" fill="#7dd3fc" stroke="rgba(10,15,30,0.5)" stroke-width="1.5"/>`;

                // Labels: show every point for daily (few points), otherwise every-other for hourly.
                // Points flagged interpolated sit between real 3-hourly buckets, so their H:/L:
                // numbers would be invented values dressed up as measurements -- the dots and the
                // band still show the shape, but no number is printed for them.
                const showEvery = points.length <= 4 ? 1 : 2;
                if ((i % showEvery === 0 || i === points.length - 1) && !pt.interpolated) {
                    const hText = `H:${Math.round(highVals[i])}°`;
                    const lText = `L:${Math.round(lowVals[i])}°`;
                    // High label above high dot; low label below low dot
                    const labelGap = valFont + 5;
                    dotsHtml += makeLabel(hText, hx, hy - 7);
                    dotsHtml += makeLabel(lText, lx, ly + labelGap);
                }
            });

            // X-axis labels
            const row0Y = H - (hasCondIcons ? iconSize + 5 : 6);
            const row1Y = row0Y - (xFont + 5);
            const xLabels = hPts.map((p, i) => {
                if (!(i % xPlan.every === 0 || i === hPts.length - 1)) return '';
                const text = points[i].label;
                const tw = estWidth(text, xFont);
                const row = Math.floor(i / xPlan.every) % xPlan.bands;
                const y = row === 1 ? row1Y : row0Y;
                return `<text x="${clampX(p.x, tw).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="${xFont}" font-weight="600" fill="rgba(255,255,255,0.92)" style="${haloStyle}stroke:rgba(10,15,30,0.85);stroke-width:3.5px;" filter="url(#${filterId})">${text}</text>`;
            }).join('');

            // Condition icons (daily mode) as HTML inside foreignObject
            const iconY = H - iconSize - 1;
            const condIcons = hasCondIcons ? hPts.map((p, i) => {
                const emoji = condIdToEmoji(points[i].condId);
                if (!emoji) return '';
                const x = Math.min(Math.max(p.x - iconSize / 2, 1), W - iconSize - 1);
                return `<foreignObject x="${x.toFixed(1)}" y="${iconY.toFixed(1)}" width="${iconSize}" height="${iconSize}" style="overflow:visible;">
                        <div xmlns="http://www.w3.org/1999/xhtml" style="width:${iconSize}px;height:${iconSize}px;display:flex;align-items:center;justify-content:center;font-size:${iconFont}px;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla','EmojiOne Color','Android Emoji',sans-serif;">${emoji}</div>
                    </foreignObject>`;
            }).join('') : '';

            return `
            <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="none" role="img" aria-label="High/low temperature trend">
                <defs>
                    <linearGradient id="${gradientId}-band" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.25"/>
                        <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.25"/>
                    </linearGradient>
                    <filter id="${filterId}" x="-30%" y="-60%" width="160%" height="220%">
                        <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="rgba(5,10,20,0.95)" flood-opacity="1"/>
                    </filter>
                </defs>
                ${grid}
                <path d="${bandPath}" fill="url(#${gradientId}-band)"/>
                <path d="${pathD(hPts)}" fill="none" stroke="#fcd34d" stroke-width="${tight ? 1.8 : 2.2}" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
                <path d="${pathD(lPts)}" fill="none" stroke="#7dd3fc" stroke-width="${tight ? 1.8 : 2.2}" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
                ${dotsHtml}
                ${xLabels}
                ${condIcons}
            </svg>`;
        }

        // --- Chart mounting / responsive redraw ---
        const chartState = new WeakMap();

        function mountChart(element, hourly, daily) {
            const host = element.querySelector('.chart-host');
            if (!host) return;

            const previous = chartState.get(element);
            if (previous && previous.observer) previous.observer.disconnect();

            // Preserve mode across re-mounts (unit toggle, re-compare)
            const prevMode = previous ? previous.mode : 'hourly';
            const state = { hourly, daily: daily || [], mode: prevMode, observer: null, lastW: 0, lastH: 0, frame: null };
            chartState.set(element, state);

            state.activeData = () => state.mode === '3day' ? state.daily : state.hourly;

            state.draw = () => {
                const rect = host.getBoundingClientRect();
                if (rect.width < 60 || rect.height < 60) return; // container hidden / not laid out yet
                const w = Math.round(rect.width);
                const h = Math.round(rect.height);
                if (Math.abs(w - state.lastW) < 3 && Math.abs(h - state.lastH) < 3) return;
                state.lastW = w; state.lastH = h;
                host.innerHTML = buildTempChartSVG(state.activeData(), `chart-grad-${element.id}`, w, h);
            };

            state.schedule = () => {
                if (state.frame) return;
                state.frame = requestAnimationFrame(() => { state.frame = null; state.draw(); });
            };

            if ('ResizeObserver' in window) {
                state.observer = new ResizeObserver(state.schedule);
                state.observer.observe(host);
            } else {
                const onResize = () => state.schedule();
                window.addEventListener('resize', onResize);
                window.addEventListener('orientationchange', onResize);
                state.observer = {
                    disconnect: () => {
                        window.removeEventListener('resize', onResize);
                        window.removeEventListener('orientationchange', onResize);
                    }
                };
            }

            state.draw();
            state.schedule();
        }

        function refreshChart(element) {
            const state = chartState.get(element);
            if (!state) return;
            state.lastW = 0; state.lastH = 0; // card size can change on flip / after icons settle
            state.draw();
            state.schedule();
        }

        function getLocalTime(timezoneOffset) {
            const d = new Date(); const utc = d.getTime();
            const cityTime = utc + (1000 * timezoneOffset);
            return new Intl.DateTimeFormat('en-US', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'UTC' }).format(new Date(cityTime));
        }

        function renderCard(element, payload) {
            const data = payload.current;
            const hourly = payload.hourly || [];
            const rawTempC = data.main.temp; const rawFeelsLikeC = data.main.feels_like; const rawWindMs = data.wind.speed;
            let mainTemp, subTemp, mainFeelsLike, mainWindSpeed, mainWindUnit;

            if (unitSystem === 'metric') {
                mainTemp = Math.round(rawTempC) + '°'; subTemp = Math.round((rawTempC * 9/5) + 32) + '°F';
                mainFeelsLike = Math.round(rawFeelsLikeC) + '°'; mainWindSpeed = Math.round(rawWindMs * 3.6); mainWindUnit = 'km/h';
            } else {
                mainTemp = Math.round((rawTempC * 9/5) + 32) + '°'; subTemp = Math.round(rawTempC) + '°C';
                mainFeelsLike = Math.round((rawFeelsLikeC * 9/5) + 32) + '°'; mainWindSpeed = Math.round(rawWindMs * 2.23694); mainWindUnit = 'mph';
            }

            const localTimeStr = getLocalTime(data.timezone);
            const iconCode = data.weather[0].icon;
            const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@4x.png`;

            // --- TIME OF DAY LOGIC ---
            const nowSeconds = Math.floor(Date.now() / 1000);
            const isDay = nowSeconds >= data.sys.sunrise && nowSeconds < data.sys.sunset;
            const weatherCondition = data.weather[0].main.toLowerCase();

            let bgClass = '';

            if (isDay) {
                // Day Themes
                if (rawTempC > 30) bgClass = 'bg-gradient-to-br from-orange-400 to-red-500'; // Hot
                else if (weatherCondition.includes('rain') || weatherCondition.includes('drizzle')) bgClass = 'bg-gradient-to-br from-slate-400 to-blue-600'; // Rain
                else if (weatherCondition.includes('cloud')) bgClass = 'bg-gradient-to-br from-blue-300 to-slate-400'; // Clouds
                else if (weatherCondition.includes('snow')) bgClass = 'bg-gradient-to-br from-blue-100 to-slate-300'; // Snow
                else bgClass = 'bg-gradient-to-br from-blue-400 to-blue-600'; // Clear
            } else {
                // Night Themes
                if (weatherCondition.includes('rain') || weatherCondition.includes('drizzle')) bgClass = 'bg-gradient-to-br from-slate-900 to-blue-900'; // Rain Night
                else if (weatherCondition.includes('cloud')) bgClass = 'bg-gradient-to-br from-blue-950 to-zinc-900'; // Cloudy Night
                else bgClass = 'bg-gradient-to-br from-indigo-900 to-gray-950'; // Clear Night
            }

            const textShadow = `drop-shadow-[0_0.2px_1.4px_rgba(0,0,0,1)]`;
            const textContrast = {
                mainText: `text-white ${textShadow} mx-0.5`,
                subText: `text-blue-100 ${textShadow} mx-0.5`,
            };

            // Preserve flip state across re-renders (unit toggle, re-compare)
            const wasFlipped = element.dataset.flipped === 'true';

            // Card element = perspective container; the flip transform lives on .card-inner
            element.className = `weather-card rounded-2xl drop-shadow-lg cursor-pointer select-none`;
            element.dataset.cityName = data.name;
            element.setAttribute('role', 'button');
            element.setAttribute('tabindex', '0');
            element.setAttribute('aria-label', `${data.name} current weather. Activate for the temperature trend.`);

            element.innerHTML = `
            <div class="card-inner${wasFlipped ? ' flipped' : ''}">
                <div class="card-face ${bgClass} shadow-lg">
                    <div class="face-body p-3 md:p-6 flex flex-col">
                        <div class="flex flex-col md:flex-row md:justify-between md:items-start mb-4 md:mb-6">
                            <div class="overflow-hidden">
                                <h2 class="text-lg md:text-2xl font-bold ${textContrast.mainText} truncate" title="${data.name}">${data.name}</h2>
                                <p class="text-xs md:text-sm font-medium ${textContrast.subText} uppercase tracking-wide truncate opacity-90">${data.sys.country}</p>
                            </div>
                            <span class="mt-1 md:mt-0 self-start px-2 py-0.5 md:px-3 md:py-1 bg-white/20 backdrop-blur-md ${textContrast.mainText} rounded-full text-[10px] md:text-xs font-bold flex items-center gap-1 border border-white/20">
                                <i data-lucide="clock" class="w-3 h-3"></i> ${localTimeStr}
                            </span>
                        </div>
                        <div class="flex flex-col md:flex-row items-center justify-between mb-4 md:mb-8">
                            <div class="flex flex-col items-center md:items-start">
                                <span class="text-4xl md:text-6xl font-black ${textContrast.mainText} tracking-tighter">${mainTemp}</span>
                                <span class="${textContrast.subText} font-medium text-sm md:text-lg">${subTemp}</span>
                            </div>
                            <img src="${iconUrl}" alt="${data.weather[0].description}" class="w-16 h-16 md:w-24 md:h-24 md:-mr-4 drop-shadow-md filter brightness-110">
                        </div>

                        <!-- Stats Grid (Glassmorphism) -->
                        <div class="bg-white/10 backdrop-blur-md rounded-xl p-2 md:p-4 grid grid-cols-1 xl:grid-cols-2 gap-2 md:gap-4 border border-white/10">
                            <div class="flex items-center gap-2 md:gap-3">
                                <div class="p-1.5 md:p-2 bg-white/20 ${textContrast.mainText} rounded-lg shrink-0"><i data-lucide="droplets" class="w-4 h-4 md:w-5 md:h-5"></i></div>
                                <div class="min-w-0"><p class="text-[10px] md:text-xs ${textContrast.subText} font-bold uppercase truncate">Humidity</p><p class="font-semibold text-sm md:text-base ${textContrast.mainText}">${data.main.humidity}%</p></div>
                            </div>
                            <div class="flex items-center gap-2 md:gap-3">
                                <div class="p-1.5 md:p-2 bg-white/20 ${textContrast.mainText} rounded-lg shrink-0"><i data-lucide="wind" class="w-4 h-4 md:w-5 md:h-5"></i></div>
                                <div class="min-w-0"><p class="text-[10px] md:text-xs ${textContrast.subText} font-bold uppercase truncate">Wind</p><p class="font-semibold text-sm md:text-base ${textContrast.mainText} truncate">${mainWindSpeed} <span class="text-[10px] md:text-xs">${mainWindUnit}</span></p></div>
                            </div>
                                <div class="flex items-center gap-2 md:gap-3">
                                <div class="p-1.5 md:p-2 bg-white/20 ${textContrast.mainText} rounded-lg shrink-0"><i data-lucide="thermometer" class="w-4 h-4 md:w-5 md:h-5"></i></div>
                                <div class="min-w-0"><p class="text-[10px] md:text-xs ${textContrast.subText} font-bold uppercase truncate">Feels Like</p><p class="font-semibold text-sm md:text-base ${textContrast.mainText}">${mainFeelsLike}</p></div>
                            </div>
                                <div class="flex items-center gap-2 md:gap-3">
                                <div class="p-1.5 md:p-2 bg-white/20 ${textContrast.mainText} rounded-lg shrink-0"><i data-lucide="eye" class="w-4 h-4 md:w-5 md:h-5"></i></div>
                                <div class="min-w-0"><p class="text-[10px] md:text-xs ${textContrast.subText} font-bold uppercase truncate">Condition</p><p class="font-semibold ${textContrast.mainText} capitalize text-sm md:text-base truncate max-w-[80px]">${data.weather[0].main}</p></div>
                            </div>
                        </div>

                        <!-- Flip hint -->
                        <div class="mt-auto pt-3 md:pt-4 md:mt-4 border-t border-white/20 flex items-center justify-center gap-1 text-[10px] md:text-xs font-bold uppercase tracking-wide ${textContrast.subText}">
                            <i data-lucide="trending-up" class="w-3 h-3 md:w-4 md:h-4"></i>
                            <span>Tap for temperature trend</span>
                        </div>
                    </div>
                </div>

                <div class="card-face card-back ${bgClass} shadow-lg">
                    <div class="absolute inset-0 bg-slate-950/55"></div>

                    <div class="trend-header flex items-start justify-between gap-2">
                        <div class="min-w-0">
                            <h3 class="text-sm md:text-lg font-bold text-white ${textShadow} truncate">${data.name}</h3>
                            <p class="trend-subtitle text-[10px] md:text-xs font-bold uppercase tracking-wide text-blue-100 ${textShadow}">${(chartState.get(element) && chartState.get(element).mode === '3day') ? 'Next 3 days' : 'Next 6 hrs · 3-hourly'} · ${tempUnitSuffix()}</p>
                        </div>
                        <button class="trend-toggle flex items-center gap-1 px-2 py-1 bg-white/20 hover:bg-white/30 active:bg-white/40 rounded-lg text-[10px] md:text-xs font-bold text-white border border-white/25 transition-colors shrink-0" title="Toggle time range">
                            <i data-lucide="calendar" class="w-3 h-3"></i>
                            <span class="trend-toggle-label">${(chartState.get(element) && chartState.get(element).mode === '3day') ? '6 hrs' : '3 day'}</span>
                        </button>
                    </div>

                    <div class="chart-host">
                        <span class="text-white/70 text-[10px] font-bold uppercase tracking-wide">Loading trend…</span>
                    </div>

                    <p class="trend-footer flex items-center justify-center gap-1 text-[9px] md:text-[10px] font-bold uppercase tracking-wide text-blue-100/80">
                        <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                        <span>Tap to flip back</span>
                    </p>
                </div>
            </div>
        `;

            mountChart(element, hourly, payload.daily || []);
        }
        function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.remove('hidden'); const form = document.querySelector('.bg-white.rounded-2xl'); form.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 300 }); }
        function hideError() { errorMsg.classList.add('hidden'); }
    </script>
</body>
</html>
